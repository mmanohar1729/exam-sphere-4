
<!DOCTYPE html>
<html>
<head>
<title>Exam Sphere Workspace</title>
<style>
body {
    font-family: Arial;
    background: #f0f4fa;
    margin: 0;
    padding: 20px;
}
.container {
    max-width: 850px;
    background: white;
    padding: 25px;
    margin: 25px auto;
    border-radius: 12px;
}
h1 { color: #1769d2; }
input, select, textarea {
    width: 100%;
    padding: 12px;
    margin: 10px 0;
    box-sizing: border-box;
    border: 1px solid #bbb;
    border-radius: 6px;
}
textarea {
    height: 300px;
    background: #101827;
    color: white;
    font-family: Consolas, monospace;
}
button {
    padding: 12px 20px;
    background: #1769d2;
    color: white;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    margin: 5px;
}
.output {
    background: #101827;
    color: #8cff9b;
    padding: 15px;
    min-height: 70px;
    white-space: pre-wrap;
}
.hidden { display: none; }
</style>
</head>

<body>

<div class="container">
<a href="index.html">← Back to Page 1</a>

<!-- STUDENT DETAILS -->

<div id="studentPage" class="hidden">

<h1>Student Details</h1>

<form id="studentForm">

<label>Student Name</label>
<input id="name" type="text" required>

<label>Student ID</label>
<input id="id" type="text" required>

<label>Student Branch</label>
<select id="branch" required>
<option value="">Select Branch</option>
<option>CSE</option>
<option>IT</option>
<option>AI & DS</option>
<option>AI & ML</option>
<option>ECE</option>
<option>EEE</option>
<option>Mechanical</option>
<option>Civil</option>
<option>Cyber Security</option>
<option>Data Science</option>
<option>Biotechnology</option>
<option>Other</option>
</select>

<label>Student Year</label>
<select id="year" required>
<option value="">Select Year</option>
<option>1st Year</option>
<option>2nd Year</option>
<option>3rd Year</option>
<option>4th Year</option>
</select>

<button type="submit">Save Details</button>

</form>

<p id="studentOutput"></p>

</div>

<!-- JAVA CODE WORKSPACE -->

<div id="codePage" class="hidden">

<h1 id="moduleTitle">Java Workspace</h1>

<p>Write your own Java program below.</p>

<textarea id="code" placeholder="Write your Java code here..."></textarea>

<button onclick="checkCode()">Check Code</button>
<button onclick="runCode()">Run Code</button>
<button onclick="clearCode()">Clear Code</button>

<h2>Output</h2>

<pre class="output" id="output">
Your Java output will appear here.
</pre>

<p id="status"></p>

</div>

</div>

<script>

const params = new URLSearchParams(window.location.search);

if (params.get("view") === "student") {

    document.getElementById("studentPage")
        .classList.remove("hidden");

} else {

    document.getElementById("codePage")
        .classList.remove("hidden");

    document.getElementById("moduleTitle").innerText =
        params.get("module") || "Java Workspace";
}


// SAVE STUDENT DETAILS

document.getElementById("studentForm")
.addEventListener("submit", function(e) {

    e.preventDefault();

    const student = {
        name: document.getElementById("name").value,
        id: document.getElementById("id").value,
        branch: document.getElementById("branch").value,
        year: document.getElementById("year").value
    };

    localStorage.setItem(
        "examSphereStudent",
        JSON.stringify(student)
    );

    document.getElementById("studentOutput").innerText =
        "Student Details Saved Successfully!\n" +
        "Name: " + student.name + "\n" +
        "ID: " + student.id + "\n" +
        "Branch: " + student.branch + "\n" +
        "Year: " + student.year;

});


// CHECK JAVA CODE

function checkCode() {

    let code = document.getElementById("code").value.trim();

    let output = document.getElementById("output");
    let status = document.getElementById("status");

    if (code === "") {
        status.innerText = "Please write Java code first.";
        return;
    }

    if (!/class\s+\w+/.test(code)) {
        status.innerText = "Java class declaration is missing.";
        return;
    }

    if (!/static\s+void\s+main\s*\(/.test(code)) {
        status.innerText = "Main method is missing.";
        return;
    }

    if ((code.match(/{/g) || []).length !==
        (code.match(/}/g) || []).length) {
        status.innerText = "Check your opening and closing braces.";
        return;
    }

    status.innerText =
        "Basic code checks passed! Click Run Code to execute.";
}


// RUN JAVA CODE

async function runCode() {

    let code = document.getElementById("code").value.trim();
    let output = document.getElementById("output");
    let status = document.getElementById("status");

    if (!code) {
        status.innerText = "Please write Java code.";
        return;
    }

    status.innerText = "Running Java program...";
    output.innerText = "Please wait...";

    try {

        const response = await fetch(
            "https://emkc.org/api/v2/piston/execute",
            {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    language: "java",
                    version: "15.0.2",
                    files: [{
                        name: "Main.java",
                        content: code
                    }]
                })
            }
        );

        if (!response.ok) {
            throw new Error("Java execution service unavailable.");
        }

        const result = await response.json();

        let compile = result.compile || {};
        let run = result.run || {};

        output.innerText =
            [compile.output, compile.stderr,
             run.output, run.stderr]
            .filter(Boolean).join("\n") ||
            "Program completed without printed output.";

        status.innerText =
            (run.code === 0 && !compile.code)
            ? "Java program executed successfully!"
            : "Error found. Check the output.";

    } catch(error) {

        status.innerText = "Unable to run. Check your internet connection.";
        output.innerText = error.message;

    }
}


// CLEAR CODE

function clearCode() {
    document.getElementById("code").value = "";
    document.getElementById("output").innerText = "";
    document.getElementById("status").innerText = "Editor cleared.";
}

</script>

</body>
</html>
